<!-- STREAMING: client included directly in the page -->
<script>
/**
 * compaiss-stream-client.js
 * COMPAiSS Platform — shared browser client for Phase 1 live status streaming
 *
 * One call replaces fetch(...) + res.json() in any institution frontend:
 *
 *   const data = await CompaissStream.ask(ENDPOINT, { question, previousQuestion });
 *   safeRender(data.answer || '(no response)');
 *
 * - Sends { stream: true } so the server streams status events.
 * - Shows each status in the existing #loading element by replacing only its
 *   text label ("Answer coming"); the animated dots are left untouched.
 *   Status text is set with nodeValue/textContent, never innerHTML.
 * - Returns the final payload exactly as the server produced it (the same
 *   object res.json() used to return), so the existing safeRender() path is
 *   unchanged. Partial answers are never rendered.
 * - Falls back to plain JSON when the server or a request guard replies
 *   normally (e.g. rate limit), and to a single read on older webviews.
 * - Throws on server errors so the page's existing fallback message shows.
 * - Phase 2: if the server streams the answer (answer_chunk events), shows it
 *   growing in a temporary box inside #out (marked + DOMPurify, same as the
 *   page). The box is removed the moment the final answer arrives, so the
 *   page's own safeRender() still renders the final, fully sanitized answer.
 * - Diagnostics: after a question, window.CompaissStreamLog shows when each
 *   status and answer piece arrived (ms after Submit). Timing only, no content.
 */
(function (global) {
  "use strict";

  function parseBlock(block) {
    var evt = "message";
    var data = "";
    block.split(/\r?\n/).forEach(function (line) {
      if (line.indexOf("event:") === 0) evt = line.slice(6).trim();
      else if (line.indexOf("data:") === 0) data += line.slice(5).trim();
    });
    if (!data) return null;
    try {
      return { event: evt, data: JSON.parse(data) };
    } catch (e) {
      return null;
    }
  }

  async function readResponse(res, onStatus, onChunk) {
    var ct = (res.headers && res.headers.get("content-type")) || "";
    if (ct.indexOf("text/event-stream") === -1) {
      return await res.json();
    }

    var finalData = null;

    function handle(block) {
      var parsed = parseBlock(block);
      if (!parsed) return;
      if (parsed.event === "status") {
        if (parsed.data && parsed.data.text && onStatus) onStatus(String(parsed.data.text), parsed.data);
      } else if (parsed.event === "answer_chunk") {
        if (parsed.data && typeof parsed.data.text === "string" && onChunk) onChunk(parsed.data.text);
      } else if (parsed.event === "answer" || parsed.event === "error") {
        finalData = parsed.data;
        if (parsed.event === "error" && finalData && !finalData.error) {
          finalData.error = "Server error";
        }
      }
    }

    if (res.body && typeof res.body.getReader === "function" && typeof TextDecoder !== "undefined") {
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buf = "";
      while (true) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buf += decoder.decode(chunk.value, { stream: true });
        var idx;
        while ((idx = buf.search(/\r?\n\r?\n/)) !== -1) {
          handle(buf.slice(0, idx));
          buf = buf.slice(idx).replace(/^\r?\n\r?\n/, "");
        }
      }
      buf += decoder.decode();
      if (buf.trim()) handle(buf);
    } else {
      // Older webviews: statuses arrive together at the end, answer still works.
      (await res.text()).split(/\r?\n\r?\n/).forEach(handle);
    }

    return finalData || { error: "Stream ended without an answer" };
  }

  // Finds the "Answer coming" text label inside the loading element.
  function findLabel(el) {
    if (!el) return null;
    for (var i = 0; i < el.childNodes.length; i++) {
      var n = el.childNodes[i];
      if (n.nodeType === 3 && n.nodeValue.trim()) return n;
    }
    return null;
  }

  // Temporary live answer box (Phase 2). Rendered with the page's own
  // marked + DOMPurify; never uses unsanitized HTML. Removed before the
  // final answer is handed back to the page.
  function createLiveAnswer(question) {
    var doc = global.document;
    var out = doc && doc.getElementById("out");
    if (!out || !global.marked || !global.DOMPurify) return null;

    var box = null;
    var text = "\u2753 Question:\n" + String(question || "") + "\n\n";
    var pending = false;
    var hadContent = !!out.innerHTML.trim();

    function render() {
      pending = false;
      if (!box) return;
      var cleaned = text
        .replace(/<+START\s*ANSWER[^>]*>+/gi, "")
        .replace(/<+END\s*ANSWER[^>]*>+/gi, "")
        .replace(/\[+COMPLETED+\]/gi, "")
        .replace(/\[+DONE+\]/gi, "");
      var html = global.DOMPurify.sanitize(global.marked.parse(cleaned), { ADD_ATTR: ["target", "rel"] });
      box.innerHTML = (hadContent ? '<div class="answer-divider"></div>' : "") + html;
      var links = box.querySelectorAll("a");
      for (var i = 0; i < links.length; i++) { links[i].target = "_blank"; links[i].rel = "noopener"; }
    }

    return {
      add: function (piece) {
        if (!box) {
          box = doc.createElement("div");
          box.setAttribute("data-compaiss-live", "1");
          out.setAttribute("aria-busy", "true"); // screen readers wait for the final answer
          out.appendChild(box);
          // The answer box sits above the text box, while the page has scrolled
          // down to the loading line. Bring the start of the new answer into view
          // once, so the student watches it grow (it then grows downward).
          try {
            if (typeof box.scrollIntoView === "function") {
              box.scrollIntoView({ behavior: "smooth", block: "start" });
            }
          } catch (e) {}
        }
        text += piece;
        if (!pending) {
          pending = true;
          (global.requestAnimationFrame || function (f) { return setTimeout(f, 30); })(render);
        }
      },
      remove: function () {
        if (box && box.parentNode) box.parentNode.removeChild(box);
        box = null;
        out.removeAttribute("aria-busy");
      }
    };
  }

  async function ask(url, body, options) {
    options = options || {};
    var doc = global.document;
    var el = options.statusEl || (doc && doc.getElementById("loading"));
    var label = findLabel(el);
    var original = label ? label.nodeValue : null;

    var live = null;

    function onStatus(text, data) {
      if (label) label.nodeValue = text;
      if (typeof options.onStatus === "function") options.onStatus(text, data);
    }

    try {
      var res = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "text/event-stream"
        },
        body: JSON.stringify(Object.assign({}, body || {}, { stream: true })),
        signal: options.signal
      });

      live = options.liveAnswer === false ? null : createLiveAnswer(body && body.question);
      var log = global.CompaissStreamLog = { startedAt: Date.now(), statuses: [], chunks: [], finalAt: null };
      var data = await readResponse(res, function (text, d) {
        log.statuses.push({ ms: Date.now() - log.startedAt, text: text });
        onStatus(text, d);
      }, function (piece) {
        log.chunks.push({ ms: Date.now() - log.startedAt, chars: piece.length });
        if (live) live.add(piece);
        if (typeof options.onAnswerChunk === "function") options.onAnswerChunk(piece);
      });

      log.finalAt = Date.now() - log.startedAt;
      if (!data || (data.error && !data.answer)) {
        throw new Error(String((data && (data.message || data.error)) || "No response"));
      }
      return data;
    } finally {
      if (live) live.remove(); // final answer (or the page's error message) replaces it
      if (label && original !== null) label.nodeValue = original;
    }
  }

  // Drop-in replacement for fetch() on pages that already do
  //   const res = await fetch(URL, { method:'POST', body: JSON.stringify({...}) });
  //   const data = await res.json();
  // Pages change only "fetch(" to "(window.CompaissStream ? CompaissStream.fetch : fetch)(".
  // Requests without a JSON object body fall straight through to normal fetch.
  async function streamFetch(url, init) {
    var body = null;
    try { body = init && typeof init.body === "string" ? JSON.parse(init.body) : null; } catch (e) { body = null; }
    if (!body || typeof body !== "object" || Array.isArray(body)) {
      return fetch(url, init);
    }
    var data = await ask(url, body, { signal: init && init.signal });
    return {
      ok: true,
      status: 200,
      headers: { get: function () { return "application/json"; } },
      json: async function () { return data; },
      text: async function () { return JSON.stringify(data); }
    };
  }

  global.CompaissStream = { ask: ask, fetch: streamFetch, readResponse: readResponse };
})(typeof window !== "undefined" ? window : globalThis);
</script>

  <script>
    marked.setOptions({gfm:true,breaks:true,mangle:false,headerIds:false});
    const outEl=document.getElementById('out');
    const dbgEl=document.getElementById('dbg');
    const showDebug=/[?&]debug=1\b/.test(location.search);
    const followupBtn=document.getElementById('followup-btn');
    const followupText=document.getElementById('followup-text');
    const loading=document.getElementById('loading');
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; 
    const copyBtn = document.getElementById('copy-btn');
    const wordCounter = document.getElementById('word-counter');
    const MAX_WORDS = 300;

// Mobile detection: iOS OR Android
const isMobile =
  /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

if (isMobile && copyBtn) {
  copyBtn.style.display = 'block';
}

function countWords(text) {
  return text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
}

followupText.addEventListener('input', () => {
  const words = countWords(followupText.value);

  if (words >= MAX_WORDS) {
    const trimmed = followupText.value
      .trim()
      .split(/\s+/)
      .slice(0, MAX_WORDS)
      .join(' ');

    followupText.value = trimmed;

    wordCounter.textContent = `${MAX_WORDS} / ${MAX_WORDS} words`;
    wordCounter.classList.add('warning');
  } else {
    wordCounter.textContent = `${words} / ${MAX_WORDS} words`;
    wordCounter.classList.remove('warning');
  }
});
    
    let linkHandlerAttached=false;
    let lastAnswer="";
    let lastSingleAnswer = "";

// ✅ Question-only memory (cheap + stable)
window.lastQuestion = "";
window.lastUserQuestion = "";
    
    let lastQuestionBackup = "";
    let firstMessageReceived=false;
    let readyPingerId=null;

    function debug(m){if(!showDebug)return;dbgEl.style.display='block';dbgEl.textContent+=(dbgEl.textContent?'\n':'')+m;}

function removeEmptyBullets() {
  const lists = document.querySelectorAll("ul, ol");
  lists.forEach(list => {
    const items = list.querySelectorAll("li");
    items.forEach(li => {
      if (!li.textContent.trim()) li.remove();
    });
    if (!list.textContent.trim()) list.remove();
  });
}
    
function safeRender(md) {
  if (String(md).trim() === 'ready') return;
  const raw = String(md || '');

  // ✅ Strip control tags (e.g., <<START ANSWER>>, [COMPLETED], etc.)
  const cleaned = raw
    .replace(/<+START\s*ANSWER[^>]*>+/gi, '')
    .replace(/<+END\s*ANSWER[^>]*>+/gi, '')
    .replace(/\[+COMPLETED+\]/gi, '')
    .replace(/\[+DONE+\]/gi, '')
    .trim();

  const html = marked.parse(cleaned);
  const clean1 = DOMPurify.sanitize(html, { ADD_ATTR: ['target', 'rel'] });
  let linked = clean1;

  try {
    if (typeof linkifyHtml === 'function') {
      linked = linkifyHtml(clean1, {
        defaultProtocol: 'https',
        nl2br: false,
        validate: { url: (v) => /^https?:\/\//i.test(v) },
        attributes: { rel: 'noopener', target: '_blank' }
      });
    }
  } catch (e) { debug('linkify error:' + e); }

  const clean2 = DOMPurify.sanitize(linked, { ADD_ATTR: ['target', 'rel'] });
  lastSingleAnswer = clean2;

  if (outEl.textContent.includes('Waiting for content')) outEl.innerHTML = '';
outEl.innerHTML +=
  (outEl.innerHTML ? '<div class="answer-divider"></div>' : '') +
  clean2;
  
  removeEmptyBullets();
  window.lastAnswerBackup = clean2;

  outEl.querySelectorAll('a').forEach(a => {
    a.target = '_blank';
    a.rel = 'noopener';
  });
}
// ✅ FIX: Replicate McGill’s timing to ensure clean tag removal
if (window.ThunkableWebviewerExtension &&
    typeof ThunkableWebviewerExtension.receiveMessage === "function") {

  ThunkableWebviewerExtension.receiveMessage(function(msg){
    try {

      // IGNORE Thunkable system / handshake messages (iOS only)
      if (msg?.command) return;

      firstMessageReceived = true;
      if (readyPingerId) {
        clearInterval(readyPingerId);
        readyPingerId = null;
      }

      setTimeout(() => {
        const payload =
          msg && typeof msg === 'object' && 'payload' in msg
            ? msg.payload
            : msg;

        safeRender(
          typeof payload === "string"
            ? payload
            : payload?.answer || ""
        );
      }, 50);

    } catch (err) {
      outEl.textContent = 'Render error:' + err;
    }
  });

}
    function pingReady(){
      try{ThunkableWebviewerExtension.postMessage('ready');}
      catch(e){debug('postMessage error:'+e);}
    }
    window.addEventListener('DOMContentLoaded',()=>{
      pingReady();
      let tries=0;
      readyPingerId=setInterval(()=>{
        if(firstMessageReceived||tries>=10){clearInterval(readyPingerId);readyPingerId=null;return;}
        pingReady();tries++;
      },600);
    });

// ✅ Trim and rename verified source links like McGill
function limitVerifiedSources() {
  const links = outEl.querySelectorAll('#out a[href]');

  // Replace generic placeholder text with readable host/path
  links.forEach(a => {
    if (a.textContent.trim().match(/Verified Greenlist Source/i)) {
      try {
        const url = new URL(a.href);
        const host = url.hostname.replace(/^www\./, '');
        const path = url.pathname.replace(/\/$/, '');
        a.textContent = host + path;
      } catch {
        a.textContent = a.href;
      }
    }
  });

  // Limit to top 8 links only
  if (links.length > 8) {
    for (let i = 8; i < links.length; i++) links[i].style.display = 'none';
    const note = document.createElement('div');
    note.textContent = '(showing top 8 verified sources)';
    note.style.textAlign = 'center';
    note.style.marginTop = '10px';
    note.style.fontSize = '14px';
    note.style.color = '#555';
    outEl.appendChild(note);
  }
}

// === COPY LAST ANSWER LOGIC ===
copyBtn.onclick = () => {
  const html = (lastSingleAnswer || "").trim();

  if (!html) {
    alert("No answer yet to copy.");
    return;
  }

  // Convert rendered HTML into readable text with links preserved
  const temp = document.createElement("div");
  temp.innerHTML = html;

  // Turn <a> tags into: Label (URL)
  temp.querySelectorAll("a[href]").forEach(a => {
    const label = a.textContent.trim();
    const url = a.href.trim();
    a.replaceWith(document.createTextNode(`${label} (${url})`));
  });

  const text = temp.innerText
    .replace(/\n{3,}/g, "\n\n")
    .trim();

  // Primary clipboard API (works on modern iOS)
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      copyBtn.textContent = "Copied!";
      setTimeout(() => (copyBtn.textContent = "Copy Last Answer"), 1500);
    }).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }

  // Fallback for older iOS / WKWebView
  function fallbackCopy() {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);

    copyBtn.textContent = "Copied!";
    setTimeout(() => (copyBtn.textContent = "Copy Last Answer"), 1500);
  }
};
