<style>

/* ============================================================
   U OF T COLOUR SYSTEM
   ============================================================ */

:root {
  --wrap: 900px;
  --pad: 16px;
  --border: #e5e7eb;

  --uoft-blue: #25355A;
  --uoft-light-blue: #007FA3;
  --uoft-pale-blue: #DDEAF0;

  --accent: #25355A;
  --text: #000000;
  --bg-page: #f5f7f9;
  --muted: #DDEAF0;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg-page);
  color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}

.wrap {
  max-width: var(--wrap);
  margin: 0 auto;
  padding: var(--pad);
}

/* Standard hyperlinks */
a {
  word-break: break-word;
  text-decoration: underline;
  color: #0645AD;
}

a:visited {
  color: #0B0080;
}

a:hover,
a:focus {
  color: #3366CC;
  opacity: 1;
}

/* ============================================================
   ANSWER CONTAINER
   ============================================================ */

#out {
  width: 96%;
  max-width: 540px;
  margin-left: auto;
  margin-right: auto;

  overflow-x: hidden;
  word-wrap: break-word;
  box-sizing: border-box;

  padding: 14px 16px;
  line-height: 1.4;

  border: 2px solid var(--accent);
  border-radius: 12px;

  background-color: #ffffff;

  box-shadow:
    0 2px 10px rgba(37,53,90,0.10);
}

#out p:first-child {
  margin-top: 8px !important;
}

#out:empty {
  display: none;
}

#out a {
  color: #0645AD !important;
}

#out a:visited {
  color: #0B0080 !important;
}

#out a:hover,
#out a:focus {
  color: #3366CC !important;
  opacity: 1;
}

#out blockquote {
  color: #000000 !important;
}

#out table th,
#out table td {
  border-color: var(--border) !important;
}

pre,
code {
  white-space: pre-wrap;
  word-break: break-word;
}

blockquote {
  margin: 0 0 1em 0;
  padding-left: 12px;
  border-left: 4px solid var(--border);
  color: #000000 !important;
}

table {
  border-collapse: collapse;
  width: 100%;
  margin: .5em 0;
}

th,
td {
  border: 1px solid var(--border);
  padding: 8px;
  vertical-align: top;
}

/* ============================================================
   QUESTION / FOLLOW-UP BOX
   ============================================================ */

#followup-box {
  width: 93%;
  max-width: 480px;

  margin-left: auto;
  margin-right: auto;
  margin-top: 16px;

  background: transparent;
  border: none;
  border-radius: 0;
  padding: 0;

  box-sizing: border-box;

  display: flex;
  flex-direction: column;
}

#followup-text {
  width: 100%;
  min-height: 200px;

  padding: 10px;

  font-size: 18px;

  border-radius: 6px;
  border: 1px solid #c7d2dc;

  outline: none;
  resize: none;

  margin: 0;

  box-sizing: border-box;

  box-shadow:
    inset 0 0 0 1px rgba(37,53,90,0.02);
}

#followup-text:focus {
  border-color: var(--uoft-light-blue);

  box-shadow:
    0 0 0 3px rgba(0,127,163,0.14);
}

#word-counter {
  text-align: right;

  font-size: 13px;
  font-weight: 500;

  color: #555;

  margin-top: 4px;
  margin-bottom: 8px;
}

#word-counter.warning {
  color: #25355A;
  font-weight: 700;
}

#followup-text,
#followup-text::placeholder,
#followup-btn,
#copy-btn {
  font-family: inherit;
  font-size: 18px;
  font-weight: 600;
  font-style: normal;
}

#followup-btn,
#copy-btn {
  margin-top: 8px;

  width: 100%;

  padding: 10px;

  font-weight: 600;

  border: none;
  border-radius: 6px;

  cursor: pointer;

  background: var(--accent);
  color: #ffffff;

  transition: opacity .2s;

  font-size: 17px;
}

#followup-btn:hover,
#copy-btn:hover {
  opacity: .9;
}

#copy-btn {
  background: #007FA3;
}

/* ============================================================
   LOADING
   ============================================================ */

#loading {
  display: none;

  text-align: center;

  margin-top: 10px;

  font-weight: 600;

  background-color: #25355A;
  color: #FFFFFF;

  padding: 12px 16px;

  border-radius: 8px;

  width: fit-content;

  margin-left: auto;
  margin-right: auto;

  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

#loading span {
  animation: blink 1.4s infinite both;
}

#loading span:nth-child(2) {
  animation-delay: .2s;
}

#loading span:nth-child(3) {
  animation-delay: .4s;
}

@keyframes blink {
  0%,80%,100% {
    opacity: 0;
  }

  40% {
    opacity: 1;
  }
}

<body>

<div class="wrap">

<!-- ==========================================================
     UNIVERSITY OF TORONTO HEADER
     ========================================================== -->

<div id="header">

  <div class="uoft-brand-lockup">

    <!--
      UNIVERSITY OF TORONTO LOGO

      Replace uoft-logo.jpg with the name/path of your U of T
      logo image if necessary.
    -->

    <img
      src="./uoft-logo.jpg"
      alt="University of Toronto"
    >

  </div>

  <div class="uoft-title">
    COMPAiSS Information Assistant
  </div>

  <div class="app-subtitle">
    🌐 Write in any language
  </div>

  <div class="languages">
    Français · हिन्दी · 普通话 · 廣東話 · ਪੰਜਾਬੀ · Español · العربية · Italiano
  </div>

  <div class="information-notice">
    This AI assistant provides information only — it does not make decisions.
  </div>

</div>

<!-- ANSWER OUTPUT -->

<div id="out"></div>

<!-- QUESTION BOX -->

<div id="followup-box">

<textarea
  id="followup-text"
  placeholder="Tap & type your University of Toronto question, issue, or concern here..."
></textarea>

<div id="word-counter">
  0 / 300 words
</div>

<button id="followup-btn">
  Submit
</button>

<button
  id="copy-btn"
  style="display:none;"
>
  Copy Last Answer
</button>

<div id="loading">
  Answer coming<span>.</span><span>.</span><span>.</span>
</div>

</div>

<div id="dbg" class="debug"></div>

</div>

<script>

marked.setOptions({
  gfm: true,
  breaks: true,
  mangle: false,
  headerIds: false
});

const outEl =
  document.getElementById('out');

const dbgEl =
  document.getElementById('dbg');

const showDebug =
  /[?&]debug=1\b/.test(location.search);

const followupBtn =
  document.getElementById('followup-btn');

const followupText =
  document.getElementById('followup-text');

const copyBtn =
  document.getElementById('copy-btn');

const wordCounter =
  document.getElementById('word-counter');

const MAX_WORDS = 300;

const isMobile =
  /iPhone|iPad|iPod|Android/i.test(
    navigator.userAgent
  );

if (isMobile && copyBtn) {
  copyBtn.style.display = 'block';
}

const loading =
  document.getElementById('loading');

let linkHandlerAttached = false;

/* ============================================================
   WORD COUNTER
   ============================================================ */

function countWords(text) {

  return text.trim() === ''
    ? 0
    : text.trim().split(/\s+/).length;

}

followupText.addEventListener(
  'input',
  () => {

    const words =
      countWords(followupText.value);

    if (words >= MAX_WORDS) {

      const trimmed =
        followupText.value
          .trim()
          .split(/\s+/)
          .slice(0, MAX_WORDS)
          .join(' ');

      followupText.value =
        trimmed;

      wordCounter.textContent =
        `${MAX_WORDS} / ${MAX_WORDS} words`;

      wordCounter.classList.add(
        'warning'
      );

    } else {

      wordCounter.textContent =
        `${words} / ${MAX_WORDS} words`;

      wordCounter.classList.remove(
        'warning'
      );

    }

  }
);

let lastAnswer = "";
let lastSingleAnswer = "";

/* ============================================================
   DEBUG
   ============================================================ */

function debug(m) {

  if (!showDebug) return;

  dbgEl.style.display =
    'block';

  dbgEl.textContent +=
    (dbgEl.textContent ? '\n' : '') + m;

}

/* ============================================================
   SAFE ANSWER RENDERING
   ============================================================ */

function safeRender(md) {

  if (
    String(md).trim() === 'ready'
  ) return;

  let cleaned =
    String(md || '');

  cleaned =
    cleaned
      .replace(
        /<+START\s*ANSWER[^>]*>+/gi,
        ''
      )
      .replace(
        /<+END\s*ANSWER[^>]*>+/gi,
        ''
      )
      .replace(
        /\[+COMPLETED+\]/gi,
        ''
      )
      .replace(
        /\[+DONE+\]/gi,
        ''
      )
      .trim();

  const html =
    marked.parse(cleaned || '');

  const step1 =
    DOMPurify.sanitize(
      html,
      {
        ADD_ATTR: [
          'target',
          'rel'
        ]
      }
    );

  let linked =
    step1;

  try {

    linked =
      linkifyHtml(
        step1,
        {
          defaultProtocol:
            'https',

          validate: {
            url:
              v =>
                /^https?:\/\//i.test(v)
          },

          attributes: {
            rel: 'noopener',
            target: '_blank'
          }
        }
      );

  } catch (_) {}

  const final =
    DOMPurify.sanitize(
      linked,
      {
        ADD_ATTR: [
          'target',
          'rel'
        ]
      }
    );

  lastSingleAnswer =
    final;

  if (
    outEl.textContent.includes(
      'Waiting for content'
    )
  ) {

    outEl.innerHTML =
      '';

  }

  outEl.innerHTML +=
    (
      outEl.innerHTML
        ? '<div class="answer-divider"></div>'
        : ''
    ) +
    final;

  /* ========================================================
     BULLET CLEANUP
     ======================================================== */

  function removeEmptyBullets() {

    const lists =
      document.querySelectorAll(
        "ul, ol"
      );

    lists.forEach(
      list => {

        const items =
          list.querySelectorAll(
            "li"
          );

        items.forEach(
          li => {

            if (
              !li.textContent.trim()
            ) {
              li.remove();
            }

          }
        );

        if (
          !list.textContent.trim()
        ) {
          list.remove();
        }

      }
    );

  }

  removeEmptyBullets();

  window.lastAnswerBackup =
    final;

  outEl
    .querySelectorAll('a')
    .forEach(
      a => {

        a.target =
          '_blank';

        a.rel =
          'noopener';

      }
    );

  /* ========================================================
     OPEN LINKS EXTERNALLY IN THUNKABLE
     ======================================================== */

  if (!linkHandlerAttached) {

    outEl.addEventListener(
      "click",
      e => {

        const a =
          e.target.closest(
            "a[href]"
          );

        if (!a) return;

        const url =
          a.href;

        if (
          window.ReactNativeWebView &&
          typeof ThunkableWebviewerExtension
            !== "undefined" &&
          typeof ThunkableWebviewerExtension
            .postMessage
            === "function"
        ) {

          e.preventDefault();

          ThunkableWebviewerExtension
            .postMessage(
              'OPEN_IN_BROWSER::' +
              url
            );

        }

      }
    );

    linkHandlerAttached =
      true;

  }

}

/* ============================================================
   THUNKABLE READY SIGNAL
   ============================================================ */

let firstMessageReceived =
  false;

let readyPingerId =
  null;

function pingReady() {

  try {

    ThunkableWebviewerExtension
      .postMessage(
        'ready'
      );

  } catch (e) {

    debug(
      'postMessage error:' +
      e
    );

  }

}

window.addEventListener(
  'DOMContentLoaded',
  () => {

    pingReady();

    let tries =
      0;

    readyPingerId =
      setInterval(
        () => {

          if (
            firstMessageReceived ||
            tries >= 10
          ) {

            clearInterval(
              readyPingerId
            );

            readyPingerId =
              null;

            return;

          }

          pingReady();

          tries++;

        },
        600
      );

  }
);

/* ============================================================
   COPY LAST ANSWER
   ============================================================ */

copyBtn.onclick =
  () => {

    const html =
      (
        lastSingleAnswer ||
        ""
      ).trim();

    if (!html) {

      alert(
        "No response yet to copy."
      );

      return;

    }

    const tempDiv =
      document.createElement(
        "div"
      );

    tempDiv.innerHTML =
      html;

    tempDiv
      .querySelectorAll(
        "a[href]"
      )
      .forEach(
        a => {

          const label =
            a.textContent.trim();

          const url =
            a.href.trim();

          const md =
            `[${label}](${url})`;

          a.replaceWith(
            document.createTextNode(
              md
            )
          );

        }
      );

    const text =
      tempDiv.innerText
        .replace(
          /\n{3,}/g,
          "\n\n"
        )
        .trim();

    try {

      navigator.clipboard
        .writeText(text)
        .then(
          () => {

            copyBtn.textContent =
              "Copied!";

            setTimeout(
              () =>
                (
                  copyBtn.textContent =
                    "Copy Last Answer"
                ),
              1500
            );

          }
        );

    } catch (err) {

      const t =
        document.createElement(
          "textarea"
        );

      t.value =
        text;

      t.style.position =
        "fixed";

      t.style.opacity =
        "0";

      document.body.appendChild(
        t
      );

      t.select();

      document.execCommand(
        "copy"
      );

      document.body.removeChild(
        t
      );

      copyBtn.textContent =
        "Copied!";

      setTimeout(
        () =>
          (
            copyBtn.textContent =
              "Copy Last Answer"
          ),
        1500
      );

    }

  };

/* ============================================================
   SUBMIT QUESTION
   ============================================================ */

followupBtn.onclick =
  async () => {

    const q =
      followupText.value.trim();

    if (!q) return;

    loading.style.display =
      'block';

    loading.scrollIntoView({
      behavior: 'smooth',
      block: 'center'
    });

    followupBtn.disabled =
      true;

    try {

      /*
        CHANGE THIS URL TO THE
        UNIVERSITY OF TORONTO
        COMPAiSS BACKEND
      */

      const res =
        await fetch(
          'https://compaiss-engine-v2-production-38f0.up.railway.app/ask',
          {

            method:
              'POST',

            headers: {
              'Content-Type':
                'application/json; charset=utf-8'
            },

            body:
              JSON.stringify(
                {

                  question:
                    q,

                  previousQuestion:
                    window.lastAnswerBackup ||
                    ""

                }
              )

          }
        );

      const data =
        await res.json();

      const oldLoading =
        document.getElementById(
          "loading-active"
        );

      if (oldLoading) {
        oldLoading.remove();
      }

      safeRender(
        data.answer ||
        '(no response)'
      );

    } catch (err) {

      const oldLoading =
        document.getElementById(
          "loading-active"
        );

      if (oldLoading) {
        oldLoading.remove();
      }

      safeRender(
        '⚠️ The system is experiencing a high volume of submissions — please try again in a few minutes.\n\nIf this is an urgent matter or personal emergency, please use the appropriate University of Toronto or local emergency service.'
      );

      console.error(
        'Fetch error:',
        err
      );

    }

    loading.style.display =
      'none';

    followupBtn.disabled =
      false;

    followupText.value =
      '';

    wordCounter.textContent =
      '0 / 300 words';

    wordCounter.classList.remove(
      'warning'
    );

  };

</script>
